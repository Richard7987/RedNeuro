<!-- GitHub Pages no incluye el motor de matemáticas de kramdown: las fórmulas llegan
     al HTML como texto entre \[ \] (bloque) o \( \) (inline). MathJax las procesa
     en el navegador si se le indican esos delimitadores además de $$ y $. -->
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    "HTML-CSS": { linebreaks: { automatic: true } }
  });
</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-AMS_CHTML"></script>
<style>
  /* el tema minimal fija la columna en 560px; las tablas y el código respiran mejor un poco más anchos */
  .wrapper { max-width: 1000px; }
  section { width: 700px; }
  table { border-collapse: collapse; margin: 1em 0; }
  th, td { border: 1px solid #ddd; padding: 4px 10px; }
  blockquote { border-left: 3px solid #e0a800; color: #333; padding-left: 12px; }
</style>
